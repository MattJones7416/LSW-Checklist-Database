name: Hydrate Parts Market (Release Prep)

on:
  workflow_dispatch:
    inputs:
      per_run_limit:
        description: "Part rows processed per pass"
        required: false
        default: "2500"
      max_api_calls_per_run:
        description: "BrickLink API budget per pass"
        required: false
        default: "20000"
      max_passes:
        description: "Maximum passes before stop"
        required: false
        default: "120"
      no_progress_passes:
        description: "Stop after this many no-progress passes"
        required: false
        default: "5"
      timeout_seconds:
        description: "HTTP timeout seconds"
        required: false
        default: "20"
      retries:
        description: "Retries per request"
        required: false
        default: "2"
      delay_seconds:
        description: "Request pacing delay"
        required: false
        default: "0.08"
      jitter_seconds:
        description: "Request pacing jitter"
        required: false
        default: "0.02"
      commit_message:
        description: "Commit message for hydrated artifacts"
        required: false
        default: "chore: hydrate parts market for release"

permissions:
  contents: write

concurrency:
  group: hydrate-parts-market-release
  cancel-in-progress: false

jobs:
  hydrate-parts:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY || vars.BRICKLINK_CONSUMER_KEY }}
      BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET || vars.BRICKLINK_CONSUMER_SECRET }}
      BRICKLINK_TOKEN_VALUE: ${{ secrets.BRICKLINK_TOKEN_VALUE || vars.BRICKLINK_TOKEN_VALUE }}
      BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET || vars.BRICKLINK_TOKEN_SECRET }}
      BRICKLINK_CURRENCY: ${{ vars.BRICKLINK_CURRENCY || 'GBP' }}
      BRICKLINK_FALLBACK_CURRENCIES: ${{ vars.BRICKLINK_FALLBACK_CURRENCIES || 'USD,EUR,GBP' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests requests_oauthlib

      - name: Validate inputs and credentials
        run: |
          missing=""
          for key in BRICKLINK_CONSUMER_KEY BRICKLINK_CONSUMER_SECRET BRICKLINK_TOKEN_VALUE BRICKLINK_TOKEN_SECRET; do
            if [ -z "${!key}" ]; then
              missing="$missing $key"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing BrickLink credentials:$missing"
            echo "Set GitHub Actions secrets/vars before running release hydration."
            exit 1
          fi

          if [ ! -f "dist/parts/parts-catalog.json" ]; then
            echo "Missing dist/parts/parts-catalog.json"
            echo "Run parts catalog build/import first."
            exit 1
          fi

      - name: Run release hydration
        env:
          PER_RUN_LIMIT: ${{ inputs.per_run_limit }}
          MAX_API_CALLS_PER_RUN: ${{ inputs.max_api_calls_per_run }}
          MAX_PASSES: ${{ inputs.max_passes }}
          NO_PROGRESS_PASSES: ${{ inputs.no_progress_passes }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          RETRIES: ${{ inputs.retries }}
          DELAY_SECONDS: ${{ inputs.delay_seconds }}
          JITTER_SECONDS: ${{ inputs.jitter_seconds }}
        run: |
          chmod +x scripts/hydrate_parts_market_release.sh
          ./scripts/hydrate_parts_market_release.sh

      - name: Coverage summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          parts_path = Path("dist/parts/parts-catalog.json")
          rows = json.loads(parts_path.read_text(encoding="utf-8"))
          total = len(rows) if isinstance(rows, list) else 0
          priced = 0
          for row in rows if isinstance(rows, list) else []:
              if not isinstance(row, dict):
                  continue
              if str(row.get("market_price_new") or "").strip() or str(row.get("market_price_used") or "").strip():
                  priced += 1
          pct = (priced / total * 100.0) if total else 0.0
          print(f"[PartsCoverage] priced={priced} total={total} pct={pct:.2f}%")
          PY

      - name: Commit and push hydrated artifacts
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "dist/parts/parts-catalog.json"
          if [ -f "dist/market-sync-state.json" ]; then
            git add "dist/market-sync-state.json"
          fi

          if git diff --cached --quiet; then
            echo "No hydrated changes to commit."
            exit 0
          fi

          git commit -m "${COMMIT_MESSAGE}"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Hydrated artifacts push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Hydrated artifacts push failed after 3 attempts."
          exit 1
