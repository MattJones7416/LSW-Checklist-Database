name: Daily Vinted Provider Deals

on:
  workflow_dispatch:
  schedule:
    - cron: "35 4 * * *"

permissions:
  contents: write

concurrency:
  group: daily-vinted-provider-deals
  cancel-in-progress: false

jobs:
  update-vinted-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      VINTED_SETS_PER_REGION: ${{ vars.VINTED_SETS_PER_REGION || '90' }}
      VINTED_MINIFIGS_PER_REGION: ${{ vars.VINTED_MINIFIGS_PER_REGION || '12' }}
      VINTED_MAX_RESULTS_PER_ITEM: ${{ vars.VINTED_MAX_RESULTS_PER_ITEM || '5' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Build Vinted provider deals
        run: |
          python scripts/update_marketplace_provider_deals.py \
            --provider vinted \
            --sets-json "dist/Lego Star Wars Database.json" \
            --minifigs-json "dist/Lego-Star-Wars-Minifigure-Database.json" \
            --parts-json "dist/parts/parts-catalog.json" \
            --output-dir "dist/provider-deals/vinted" \
            --state-path "dist/provider-deals/vinted/state.json" \
            --regions UK \
            --sets-per-region "${VINTED_SETS_PER_REGION}" \
            --minifigs-per-region "${VINTED_MINIFIGS_PER_REGION}" \
            --parts-per-region 0 \
            --max-results-per-item "${VINTED_MAX_RESULTS_PER_ITEM}" \
            --verbose

      - name: Commit and push Vinted provider deals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/provider-deals/vinted"
          if git diff --cached --quiet; then
            echo "No Vinted provider deal changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh vinted provider deals"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Vinted provider push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Vinted provider push rejected on attempt $attempt; rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Vinted provider push failed after 3 attempts."
          exit 1
