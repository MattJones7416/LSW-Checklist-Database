name: Daily eBay Marketplace Deals

on:
  workflow_dispatch:
  schedule:
    - cron: "10 4 * * *"

permissions:
  contents: write

concurrency:
  group: daily-ebay-marketplace-deals
  cancel-in-progress: false

jobs:
  update-ebay-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID || vars.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET || vars.EBAY_CLIENT_SECRET }}
      EBAY_MARKET_REGIONS: ${{ vars.EBAY_MARKET_REGIONS || 'UK,US' }}
      EBAY_SETS_PER_REGION: ${{ vars.EBAY_SETS_PER_REGION || '50' }}
      EBAY_MINIFIGS_PER_REGION: ${{ vars.EBAY_MINIFIGS_PER_REGION || '35' }}
      EBAY_PARTS_PER_REGION: ${{ vars.EBAY_PARTS_PER_REGION || '25' }}
      EBAY_MAX_RESULTS_PER_ITEM: ${{ vars.EBAY_MAX_RESULTS_PER_ITEM || '5' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Normalize eBay credentials
        shell: bash
        run: |
          {
            printf 'EBAY_CLIENT_ID=%s\n' "$(printf '%s' "${EBAY_CLIENT_ID}" | tr -d '\r\n' | sed -E 's/^\"(.*)\"$/\1/; s/^'\''(.*)'\''$/\1/')"
            printf 'EBAY_CLIENT_SECRET=%s\n' "$(printf '%s' "${EBAY_CLIENT_SECRET}" | tr -d '\r\n' | sed -E 's/^\"(.*)\"$/\1/; s/^'\''(.*)'\''$/\1/')"
          } >> "$GITHUB_ENV"

      - name: Validate credentials and inputs
        shell: bash
        run: |
          if [ -z "${EBAY_CLIENT_ID}" ] || [ -z "${EBAY_CLIENT_SECRET}" ]; then
            echo "Missing EBAY_CLIENT_ID or EBAY_CLIENT_SECRET"
            exit 1
          fi
          echo "eBay credential lengths: client_id=$(printf '%s' "${EBAY_CLIENT_ID}" | wc -c | tr -d ' '), client_secret=$(printf '%s' "${EBAY_CLIENT_SECRET}" | wc -c | tr -d ' ')"
          if [ ! -f "dist/Lego Star Wars Database.json" ]; then
            echo "Missing dist/Lego Star Wars Database.json"
            exit 1
          fi
          if [ ! -f "dist/Lego-Star-Wars-Minifigure-Database.json" ]; then
            echo "Missing dist/Lego-Star-Wars-Minifigure-Database.json"
            exit 1
          fi

      - name: Fetch eBay marketplace deals
        run: |
          python scripts/update_ebay_marketplace_deals.py \
            --sets-json "dist/Lego Star Wars Database.json" \
            --minifigs-json "dist/Lego-Star-Wars-Minifigure-Database.json" \
            --parts-json "dist/parts/parts-catalog.json" \
            --output-dir "dist/deals" \
            --fallback-output "dist/marketplace-deals.json" \
            --state-path "dist/ebay-market-state.json" \
            --regions "${EBAY_MARKET_REGIONS}" \
            --sets-per-region "${EBAY_SETS_PER_REGION}" \
            --minifigs-per-region "${EBAY_MINIFIGS_PER_REGION}" \
            --parts-per-region "${EBAY_PARTS_PER_REGION}" \
            --max-results-per-item "${EBAY_MAX_RESULTS_PER_ITEM}" \
            --verbose

      - name: Commit and push eBay deals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "dist/deals" "dist/marketplace-deals.json" "dist/ebay-market-state.json"

          if git diff --cached --quiet; then
            echo "No eBay deal changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh ebay marketplace deals"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "eBay deals push succeeded on attempt $attempt."
              exit 0
            fi
            echo "eBay deals push rejected on attempt $attempt; rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
          done

          echo "eBay deals push failed after 3 attempts."
          exit 1
