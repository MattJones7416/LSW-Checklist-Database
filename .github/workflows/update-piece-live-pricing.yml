name: Update Piece Live Pricing

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

concurrency:
  group: update-piece-live-pricing
  cancel-in-progress: false

jobs:
  update-piece-live-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests requests-oauthlib

      - name: Refresh piece live pricing batch
        run: |
          python scripts/update_piece_live_pricing.py \
            --parts-json "dist/parts/parts-catalog.json" \
            --output "dist/parts/piece-live-pricing.json" \
            --state-path "dist/parts/piece-live-pricing-state.json" \
            --limit 240 \
            --workers 2 \
            --html-delay-seconds 0.35 \
            --html-jitter-seconds 0.15

      - name: Rebuild touched piece folders
        run: |
          python scripts/build_item_folder_catalog.py \
            --sets-json "dist/Lego Star Wars Database.json" \
            --minifigs-json "dist/Lego-Star-Wars-Minifigure-Database.json" \
            --parts-json "dist/parts/parts-catalog.json" \
            --set-parts-index-json "dist/parts/set-parts-index.json" \
            --set-parts-dir "dist/parts/set-parts" \
            --market-details-dir "dist/market-details" \
            --piece-live-pricing-json "dist/parts/piece-live-pricing.json" \
            --output-dir "dist/catalog" \
            --item-type piece \
            --changed-state-json "dist/parts/piece-live-pricing-state.json"

      - name: Commit and push piece live pricing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/parts/piece-live-pricing.json" "dist/parts/piece-live-pricing-state.json" "dist/catalog"
          if git diff --cached --quiet; then
            echo "No piece live pricing changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh piece live pricing"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Piece live pricing push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Piece live pricing push rejected on attempt $attempt; rebuilding on top of latest main..."
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_piece_live_pricing.py \
              --parts-json "dist/parts/parts-catalog.json" \
              --output "dist/parts/piece-live-pricing.json" \
              --state-path "dist/parts/piece-live-pricing-state.json" \
              --limit 240 \
              --workers 2 \
              --html-delay-seconds 0.35 \
              --html-jitter-seconds 0.15
            python scripts/build_item_folder_catalog.py \
              --sets-json "dist/Lego Star Wars Database.json" \
              --minifigs-json "dist/Lego-Star-Wars-Minifigure-Database.json" \
              --parts-json "dist/parts/parts-catalog.json" \
              --set-parts-index-json "dist/parts/set-parts-index.json" \
              --set-parts-dir "dist/parts/set-parts" \
              --market-details-dir "dist/market-details" \
              --piece-live-pricing-json "dist/parts/piece-live-pricing.json" \
              --output-dir "dist/catalog" \
              --item-type piece \
              --changed-state-json "dist/parts/piece-live-pricing-state.json"
            git add "dist/parts/piece-live-pricing.json" "dist/parts/piece-live-pricing-state.json" "dist/catalog"
            if git diff --cached --quiet; then
              echo "No piece live pricing changes to commit after refresh on attempt $attempt."
              exit 0
            fi
            git commit -m "chore: refresh piece live pricing"
          done
          echo "Piece live pricing push failed after 3 attempts."
          exit 1
