name: Daily Amazon Provider Deals

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: write

concurrency:
  group: daily-amazon-provider-deals
  cancel-in-progress: false

jobs:
  update-amazon-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      AMAZON_SETS_PER_REGION: ${{ vars.AMAZON_SETS_PER_REGION || '90' }}
      AMAZON_MINIFIGS_PER_REGION: ${{ vars.AMAZON_MINIFIGS_PER_REGION || '15' }}
      AMAZON_PARTS_PER_REGION: ${{ vars.AMAZON_PARTS_PER_REGION || '10' }}
      AMAZON_MAX_RESULTS_PER_ITEM: ${{ vars.AMAZON_MAX_RESULTS_PER_ITEM || '5' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Build Amazon provider deals
        run: |
          python scripts/update_marketplace_provider_deals.py \
            --provider amazon \
            --sets-json "dist/Lego Star Wars Database.json" \
            --minifigs-json "dist/Lego-Star-Wars-Minifigure-Database.json" \
            --parts-json "dist/parts/parts-catalog.json" \
            --output-dir "dist/provider-deals/amazon" \
            --state-path "dist/provider-deals/amazon/state.json" \
            --regions UK \
            --sets-per-region "${AMAZON_SETS_PER_REGION}" \
            --minifigs-per-region "${AMAZON_MINIFIGS_PER_REGION}" \
            --parts-per-region "${AMAZON_PARTS_PER_REGION}" \
            --max-results-per-item "${AMAZON_MAX_RESULTS_PER_ITEM}" \
            --verbose

      - name: Commit and push Amazon provider deals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/provider-deals/amazon"
          if git diff --cached --quiet; then
            echo "No Amazon provider deal changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh amazon provider deals"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Amazon provider push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Amazon provider push rejected on attempt $attempt; rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Amazon provider push failed after 3 attempts."
          exit 1
