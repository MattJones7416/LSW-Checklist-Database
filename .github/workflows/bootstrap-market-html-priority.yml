name: Bootstrap BrickLink Market via HTML (Priority Release Sets)

on:
  workflow_dispatch:
    inputs:
      max_total:
        description: "Maximum priority set targets to bootstrap"
        required: false
        default: "1500"
      workers:
        description: "Concurrent HTML workers"
        required: false
        default: "2"
      batch_size:
        description: "Sets per batch"
        required: false
        default: "150"
      batch_pause_seconds:
        description: "Cooldown between batches"
        required: false
        default: "20"
      delay_seconds:
        description: "Request pacing delay"
        required: false
        default: "0.40"
      jitter_seconds:
        description: "Request pacing jitter"
        required: false
        default: "0.15"
      missing_only:
        description: "Only bootstrap rows missing values/history"
        required: false
        default: "1"
      commit_message:
        description: "Commit message for bootstrapped outputs"
        required: false
        default: "chore: bootstrap priority BrickLink market sets for release"

permissions:
  contents: write

concurrency:
  group: bootstrap-market-html-priority
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests requests_oauthlib

      - name: Bootstrap priority BrickLink HTML market data
        env:
          MAX_TOTAL: ${{ inputs.max_total }}
          WORKERS: ${{ inputs.workers }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          BATCH_PAUSE_SECONDS: ${{ inputs.batch_pause_seconds }}
          DELAY_SECONDS: ${{ inputs.delay_seconds }}
          JITTER_SECONDS: ${{ inputs.jitter_seconds }}
          MISSING_ONLY: ${{ inputs.missing_only }}
          BRICKLINK_CURRENCY: ${{ vars.BRICKLINK_CURRENCY || 'GBP' }}
        run: |
          chmod +x scripts/bootstrap_release_priority_market_html.sh
          ./scripts/bootstrap_release_priority_market_html.sh

      - name: Commit and push bootstrapped artifacts
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git restore --staged "dist/Lego Star Wars Database.json" 2>/dev/null || true
          git restore --staged "dist/Lego-Star-Wars-Minifigure-Database.json" 2>/dev/null || true
          git reset HEAD -- "dist/Lego Star Wars Database.json" "dist/Lego-Star-Wars-Minifigure-Database.json" 2>/dev/null || true

          git add "dist/catalog-index.json" "dist/catalog-delta-index.json" "dist/client-config.json" "dist/market-price-seed.json" "dist/chunks" "dist/market-details"
          if [ -f "dist/sync-state.json" ]; then
            git add "dist/sync-state.json"
          fi
          if [ -f "dist/bricklink-set-aliases.json" ]; then
            git add "dist/bricklink-set-aliases.json"
          fi
          if [ -f "dist/bootstrap-release-targets.txt" ]; then
            git add "dist/bootstrap-release-targets.txt"
          fi
          if [ -f "dist/bootstrap-release-targets.json" ]; then
            git add "dist/bootstrap-release-targets.json"
          fi

          git restore --staged "dist/Lego Star Wars Database.json" 2>/dev/null || true
          git restore --staged "dist/Lego-Star-Wars-Minifigure-Database.json" 2>/dev/null || true
          git reset HEAD -- "dist/Lego Star Wars Database.json" "dist/Lego-Star-Wars-Minifigure-Database.json" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No bootstrapped output changes to commit."
            exit 0
          fi

          git commit -m "${COMMIT_MESSAGE}"
          git push origin HEAD:main
