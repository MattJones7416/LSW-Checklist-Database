name: Daily BrickLink Market Refresh

on:
  workflow_dispatch:
    inputs:
      sets_per_run:
        description: "Set rows processed this run"
        required: false
        default: "450"
      minifigs_per_run:
        description: "Minifig rows processed this run"
        required: false
        default: "300"
      parts_per_run:
        description: "Part rows processed this run"
        required: false
        default: "200"
  schedule:
    - cron: "25 2 * * *"

permissions:
  contents: write

concurrency:
  group: daily-bricklink-market-refresh
  cancel-in-progress: false

jobs:
  refresh-market:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY || vars.BRICKLINK_CONSUMER_KEY }}
      BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET || vars.BRICKLINK_CONSUMER_SECRET }}
      BRICKLINK_TOKEN_VALUE: ${{ secrets.BRICKLINK_TOKEN_VALUE || vars.BRICKLINK_TOKEN_VALUE }}
      BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET || vars.BRICKLINK_TOKEN_SECRET }}
      BRICKLINK_CURRENCY: ${{ vars.BRICKLINK_CURRENCY || 'GBP' }}
      BRICKLINK_FALLBACK_CURRENCIES: ${{ vars.BRICKLINK_FALLBACK_CURRENCIES || 'USD,EUR,GBP' }}
      DIST_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/dist
      MARKET_NO_DATA_COOLDOWN_HOURS: ${{ vars.MARKET_NO_DATA_COOLDOWN_HOURS || '168' }}
      ACTIVE_SET_THEMES: ${{ vars.ACTIVE_SET_THEMES || vars.MARKET_PRIORITY_THEMES || 'Star Wars,Marvel Super Heroes,Disney,NINJAGO' }}
      ACTIVE_MINIFIG_CATEGORIES: ${{ vars.ACTIVE_MINIFIG_CATEGORIES || vars.MARKET_PRIORITY_MINIFIG_CATEGORIES || 'Star Wars,Marvel Super Heroes,Disney,NINJAGO' }}
      ACTIVE_PART_CATEGORIES: ${{ vars.ACTIVE_PART_CATEGORIES || vars.MARKET_PRIORITY_PART_CATEGORIES || 'Bricks,Plates,Tiles,Minifigure' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests requests_oauthlib

      - name: Validate credentials and required files
        run: |
          missing=""
          for key in BRICKLINK_CONSUMER_KEY BRICKLINK_CONSUMER_SECRET BRICKLINK_TOKEN_VALUE BRICKLINK_TOKEN_SECRET; do
            if [ -z "${!key}" ]; then
              missing="$missing $key"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing BrickLink credentials:$missing"
            exit 1
          fi
          if [ ! -f "dist/Lego Star Wars Database.json" ]; then
            echo "Missing dist/Lego Star Wars Database.json"
            exit 1
          fi
          if [ ! -f "dist/Lego-Star-Wars-Minifigure-Database.json" ]; then
            echo "Missing dist/Lego-Star-Wars-Minifigure-Database.json"
            exit 1
          fi

      - name: Refresh set market values
        env:
          SETS_PER_RUN: ${{ github.event.inputs.sets_per_run || vars.MARKET_SETS_PER_RUN || '450' }}
        run: |
          python scripts/update_market_values.py \
            --item-type set \
            --sets-json "dist/Lego Star Wars Database.json" \
            --minifigs-json "dist/Lego-Star-Wars-Minifigure-Database.json" \
            --parts-json "dist/parts/parts-catalog.json" \
            --currency-code "${BRICKLINK_CURRENCY}" \
            --fallback-currencies "${BRICKLINK_FALLBACK_CURRENCIES}" \
            --priority-themes "${ACTIVE_SET_THEMES}" \
            --priority-minifig-categories "${ACTIVE_MINIFIG_CATEGORIES}" \
            --priority-part-categories "${ACTIVE_PART_CATEGORIES}" \
            --no-data-cooldown-hours "${MARKET_NO_DATA_COOLDOWN_HOURS}" \
            --limit "${SETS_PER_RUN}" \
            --max-api-calls 2200 \
            --market-state-json "dist/market-sync-state.json" \
            --catalog-sync-state-json "dist/sync-state.json" \
            --set-aliases-json "dist/bricklink-set-aliases.json" \
            --delay 0.10 \
            --jitter 0.03 \
            --timeout 20 \
            --retries 2 \
            --disable-html-fallback \
            --verbose

      - name: Refresh minifigure market values
        env:
          MINIFIGS_PER_RUN: ${{ github.event.inputs.minifigs_per_run || vars.MARKET_MINIFIGS_PER_RUN || '300' }}
        run: |
          python scripts/update_market_values.py \
            --item-type minifig \
            --sets-json "dist/Lego Star Wars Database.json" \
            --minifigs-json "dist/Lego-Star-Wars-Minifigure-Database.json" \
            --parts-json "dist/parts/parts-catalog.json" \
            --currency-code "${BRICKLINK_CURRENCY}" \
            --fallback-currencies "${BRICKLINK_FALLBACK_CURRENCIES}" \
            --priority-themes "${ACTIVE_SET_THEMES}" \
            --priority-minifig-categories "${ACTIVE_MINIFIG_CATEGORIES}" \
            --priority-part-categories "${ACTIVE_PART_CATEGORIES}" \
            --no-data-cooldown-hours "${MARKET_NO_DATA_COOLDOWN_HOURS}" \
            --limit "${MINIFIGS_PER_RUN}" \
            --max-api-calls 1200 \
            --market-state-json "dist/market-sync-state.json" \
            --catalog-sync-state-json "dist/sync-state.json" \
            --set-aliases-json "dist/bricklink-set-aliases.json" \
            --delay 0.10 \
            --jitter 0.03 \
            --timeout 20 \
            --retries 2 \
            --disable-html-fallback \
            --verbose

      - name: Refresh part market values
        if: ${{ hashFiles('dist/parts/parts-catalog.json') != '' }}
        env:
          PARTS_PER_RUN: ${{ github.event.inputs.parts_per_run || vars.MARKET_PARTS_PER_RUN || '200' }}
        run: |
          python scripts/update_market_values.py \
            --item-type part \
            --sets-json "dist/Lego Star Wars Database.json" \
            --minifigs-json "dist/Lego-Star-Wars-Minifigure-Database.json" \
            --parts-json "dist/parts/parts-catalog.json" \
            --currency-code "${BRICKLINK_CURRENCY}" \
            --fallback-currencies "${BRICKLINK_FALLBACK_CURRENCIES}" \
            --priority-themes "${ACTIVE_SET_THEMES}" \
            --priority-minifig-categories "${ACTIVE_MINIFIG_CATEGORIES}" \
            --priority-part-categories "${ACTIVE_PART_CATEGORIES}" \
            --no-data-cooldown-hours "${MARKET_NO_DATA_COOLDOWN_HOURS}" \
            --limit "${PARTS_PER_RUN}" \
            --max-api-calls 800 \
            --market-state-json "dist/market-sync-state.json" \
            --catalog-sync-state-json "dist/sync-state.json" \
            --set-aliases-json "dist/bricklink-set-aliases.json" \
            --delay 0.10 \
            --jitter 0.03 \
            --timeout 20 \
            --retries 2 \
            --disable-html-fallback \
            --verbose

      - name: Rebuild chunked outputs + market details
        run: |
          rm -rf "dist/chunks" "dist/market-details"

          python scripts/split_catalog_chunks.py \
            --sets-json "dist/Lego Star Wars Database.json" \
            --minifigs-json "dist/Lego-Star-Wars-Minifigure-Database.json" \
            --output-dir "dist/chunks" \
            --manifest-path "dist/catalog-index.json" \
            --base-url "${DIST_BASE_URL}" \
            --market-details-dir "dist/market-details" \
            --strip-market-detail-fields \
            --max-items-per-chunk 800

          python scripts/build_sync_artifacts.py \
            --manifest-path "dist/catalog-index.json" \
            --sync-state-path "dist/sync-state.json" \
            --sets-json "dist/Lego Star Wars Database.json" \
            --minifigs-json "dist/Lego-Star-Wars-Minifigure-Database.json" \
            --delta-manifest-path "dist/catalog-delta-index.json" \
            --client-config-path "dist/client-config.json" \
            --market-price-seed-path "dist/market-price-seed.json" \
            --base-url "${DIST_BASE_URL}" \
            --market-currency-code "${BRICKLINK_CURRENCY}" \
            --verbose

      - name: Validate monolith sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          limit = 99_500_000
          paths = [
              Path("dist/Lego Star Wars Database.json"),
              Path("dist/Lego-Star-Wars-Minifigure-Database.json"),
          ]
          for path in paths:
              size = path.stat().st_size
              print(f"[SizeCheck] {path} bytes={size}")
              if size > limit:
                  raise SystemExit(f"{path} exceeds safe GitHub commit size threshold ({size} > {limit})")
          PY

      - name: Commit and push refreshed market artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "dist/Lego Star Wars Database.json" \
            "dist/Lego-Star-Wars-Minifigure-Database.json" \
            "dist/catalog-index.json" \
            "dist/catalog-delta-index.json" \
            "dist/client-config.json" \
            "dist/market-price-seed.json" \
            "dist/chunks" \
            "dist/market-details"

          if [ -f "dist/market-sync-state.json" ]; then
            git add "dist/market-sync-state.json"
          fi
          if [ -f "dist/sync-state.json" ]; then
            git add "dist/sync-state.json"
          fi
          if [ -f "dist/bricklink-set-aliases.json" ]; then
            git add "dist/bricklink-set-aliases.json"
          fi
          if [ -f "dist/parts/parts-catalog.json" ]; then
            git add "dist/parts/parts-catalog.json"
          fi

          if git diff --cached --quiet; then
            echo "No market refresh changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh bricklink market data"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Market refresh push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Market refresh push rejected on attempt $attempt; rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Market refresh push failed after 3 attempts."
          exit 1
