name: Daily BrickOwl Provider Deals

on:
  workflow_dispatch:
  schedule:
    - cron: "10 4 * * *"

permissions:
  contents: write

concurrency:
  group: daily-brickowl-provider-deals
  cancel-in-progress: false

jobs:
  update-brickowl-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BRICKOWL_SETS_PER_REGION: ${{ vars.BRICKOWL_SETS_PER_REGION || '90' }}
      BRICKOWL_MINIFIGS_PER_REGION: ${{ vars.BRICKOWL_MINIFIGS_PER_REGION || '20' }}
      BRICKOWL_PARTS_PER_REGION: ${{ vars.BRICKOWL_PARTS_PER_REGION || '15' }}
      BRICKOWL_MAX_RESULTS_PER_ITEM: ${{ vars.BRICKOWL_MAX_RESULTS_PER_ITEM || '3' }}
      BRICKOWL_MAX_PRODUCT_PAGES_PER_ITEM: ${{ vars.BRICKOWL_MAX_PRODUCT_PAGES_PER_ITEM || '3' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Build BrickOwl provider deals
        run: |
          python scripts/update_marketplace_provider_deals.py \
            --provider brickowl \
            --sets-json "dist/Lego Star Wars Database.json" \
            --minifigs-json "dist/Lego-Star-Wars-Minifigure-Database.json" \
            --parts-json "dist/parts/parts-catalog.json" \
            --output-dir "dist/provider-deals/brickowl" \
            --state-path "dist/provider-deals/brickowl/state.json" \
            --regions UK \
            --sets-per-region "${BRICKOWL_SETS_PER_REGION}" \
            --minifigs-per-region "${BRICKOWL_MINIFIGS_PER_REGION}" \
            --parts-per-region "${BRICKOWL_PARTS_PER_REGION}" \
            --max-results-per-item "${BRICKOWL_MAX_RESULTS_PER_ITEM}" \
            --max-product-pages-per-item "${BRICKOWL_MAX_PRODUCT_PAGES_PER_ITEM}" \
            --verbose

      - name: Commit and push BrickOwl provider deals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/provider-deals/brickowl"
          if git diff --cached --quiet; then
            echo "No BrickOwl provider deal changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh brickowl provider deals"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "BrickOwl provider push succeeded on attempt $attempt."
              exit 0
            fi
            echo "BrickOwl provider push rejected on attempt $attempt; rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "BrickOwl provider push failed after 3 attempts."
          exit 1
