name: Refresh Single Marketplace Model
run-name: Refresh shop ${{ inputs.item_type }} ${{ inputs.number }} · ${{ inputs.request_key }}

on:
  workflow_dispatch:
    inputs:
      number:
        description: Catalog number to refresh
        required: true
        type: string
      item_type:
        description: Model type (set, minifig, part)
        required: true
        type: string
      region:
        description: Region code
        required: true
        default: UK
        type: string
      request_key:
        description: Client request correlation key
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-single-marketplace-${{ inputs.region }}-${{ inputs.number }}
  cancel-in-progress: false

jobs:
  refresh-single-marketplace-model:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Refresh requested model marketplace listings
        id: refresh
        run: |
          set +e
          python scripts/refresh_single_marketplace_model.py \
            --number "${{ inputs.number }}" \
            --item-type "${{ inputs.item_type }}" \
            --region "${{ inputs.region }}" \
            --request-key "${{ inputs.request_key }}" \
            --sets-json "dist/Lego Star Wars Database.json" \
            --minifigs-json "dist/Lego-Star-Wars-Minifigure-Database.json" \
            --parts-json "dist/parts/parts-catalog.json" \
            --provider-root "dist/provider-deals" \
            --merged-output-dir "dist/deals" \
            --merged-fallback-output "dist/marketplace-deals.json" \
            --status-output-dir "dist/marketplace-refresh-status" \
            --verbose
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit and push refreshed marketplace artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/provider-deals" "dist/deals" "dist/marketplace-deals.json" "dist/marketplace-refresh-status"
          if git diff --cached --quiet; then
            echo "No refreshed marketplace changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh marketplace model ${{ inputs.number }}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Single marketplace refresh push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Single marketplace refresh push rejected on attempt $attempt; rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Single marketplace refresh push failed after 3 attempts."
          exit 1

      - name: Fail workflow when refresh script reported failure
        if: steps.refresh.outputs.exit_code != '0'
        run: |
          echo "Refresh script exited with ${{ steps.refresh.outputs.exit_code }}"
          exit 1
