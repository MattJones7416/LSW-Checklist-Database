name: Daily Rebrickable Catalog Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "40 0 * * *"

permissions:
  contents: write

concurrency:
  group: daily-rebrickable-catalog-sync
  cancel-in-progress: false

jobs:
  sync-rebrickable:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DIST_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/dist
      MARKET_CURRENCY_CODE: ${{ vars.BRICKLINK_CURRENCY || 'GBP' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run Rebrickable catalog sync
        run: |
          chmod +x scripts/sync_rebrickable_catalog_release.sh
          ./scripts/sync_rebrickable_catalog_release.sh

      - name: Validate monolith sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          limit = 99_500_000
          paths = [
              Path("dist/Lego Star Wars Database.json"),
              Path("dist/Lego-Star-Wars-Minifigure-Database.json"),
          ]
          for path in paths:
              size = path.stat().st_size
              print(f"[SizeCheck] {path} bytes={size}")
              if size > limit:
                  raise SystemExit(f"{path} exceeds safe GitHub commit size threshold ({size} > {limit})")
          PY

      - name: Commit and push sync artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "dist/Lego Star Wars Database.json" \
            "dist/Lego-Star-Wars-Minifigure-Database.json" \
            "dist/Themes.json" \
            "dist/catalog-index.json" \
            "dist/catalog-delta-index.json" \
            "dist/client-config.json" \
            "dist/market-price-seed.json" \
            "dist/chunks" \
            "dist/market-details" \
            "dist/parts/parts-catalog.json" \
            "dist/parts/set-parts-index.json" \
            "dist/parts/set-parts"

          if [ -f "dist/sync-state.json" ]; then
            git add "dist/sync-state.json"
          fi

          if git diff --cached --quiet; then
            echo "No catalog sync changes to commit."
            exit 0
          fi

          git commit -m "chore: sync catalog from rebrickable"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Catalog sync push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Catalog sync push rejected on attempt $attempt; rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Catalog sync push failed after 3 attempts."
          exit 1
