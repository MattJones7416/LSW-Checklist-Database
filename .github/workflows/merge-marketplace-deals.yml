name: Merge Marketplace Deals

on:
  workflow_dispatch:
  schedule:
    - cron: "40 5 * * *"

permissions:
  contents: write

concurrency:
  group: merge-marketplace-deals
  cancel-in-progress: false

jobs:
  merge-marketplace-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Merge provider deal artifacts
        run: |
          python scripts/merge_marketplace_deals.py \
            --provider-root "dist/provider-deals" \
            --output-dir "dist/deals" \
            --fallback-output "dist/marketplace-deals.json"

      - name: Commit and push merged marketplace deals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/deals" "dist/marketplace-deals.json"
          if git diff --cached --quiet; then
            echo "No merged marketplace deal changes to commit."
            exit 0
          fi
          git commit -m "chore: merge marketplace deals"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Merged marketplace deals push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Merged marketplace deals push rejected on attempt $attempt; rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Merged marketplace deals push failed after 3 attempts."
          exit 1
